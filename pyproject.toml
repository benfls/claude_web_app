[project]
name = "webapp"
version = "0.1.0"
description = "Application web simple avec Flask"
readme = "README.md"
authors = [
    { name = "benfls", email = "ben.flous300502@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.3",
    "python-dotenv>=1.2.4",
]

[project.scripts]
webapp = "webapp:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
