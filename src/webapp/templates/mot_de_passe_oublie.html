{% extends "base.html" %}

{% block titre %}Mot de passe oublié{% endblock %}

{% block contenu %}
<h1>Mot de passe oublié</h1>

<p>
    Indiquez l'adresse e-mail de votre compte : vous recevrez un lien pour
    choisir un nouveau mot de passe.
</p>

<form method="post" class="formulaire-compte">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <label for="email">Adresse e-mail</label>
    <input type="email" id="email" name="email" maxlength="254"
           autocomplete="email" required>

    <button type="submit">Recevoir le lien</button>
</form>

<p><a href="{{ url_for('auth.connexion') }}">Retour à la connexion</a></p>
{% endblock %}
