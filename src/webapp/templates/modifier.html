{% extends "base.html" %}

{% block titre %}Modifier un nom{% endblock %}

{% block contenu %}
<h1>Modifier un nom</h1>

<form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="nom">Nouveau nom :</label>
    <input type="text" id="nom" name="nom" value="{{ saisie }}"
           maxlength="{{ longueur_max }}" required>
    <button type="submit">Enregistrer</button>
</form>

{% if erreur %}
<p class="erreur">{{ erreur }}</p>
{% endif %}

<p><a href="{{ url_for('pages.bonjour') }}">Annuler</a></p>
{% endblock %}
