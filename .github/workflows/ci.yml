# Intégration continue : GitHub exécute ces vérifications à chaque push.
# Résultats : onglet "Actions" du dépôt sur GitHub.
name: CI

# Quand lancer le workflow.
on:
  push:
    branches: [main]
  pull_request:
  # Ajoute un bouton "Run workflow" dans l'onglet Actions.
  workflow_dispatch:

# Droits minimum : le workflow peut seulement lire le code.
permissions:
  contents: read

# Si on pousse deux fois de suite, la première exécution est annulée.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --- Job 1 : les tests pytest ----------------------------------------------
  tests:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Récupère le code du dépôt sur la machine.
      - uses: actions/checkout@v7.0.1

      # Installe uv (la même version qu'en local).
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.13.0"
          # Garde en cache les paquets téléchargés : les exécutions
          # suivantes sont plus rapides.
          enable-cache: true

      # Installe Python (version du fichier .python-version) et les
      # dépendances. --locked : échoue si uv.lock n'est pas à jour.
      - name: Installer les dépendances
        run: uv sync --locked

      - name: Lancer les tests
        run: uv run pytest -v

  # --- Job 2 : les mêmes tests sur PostgreSQL (la base de la production) -----
  tests-postgresql:
    name: Tests (pytest, PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Un "service" est un conteneur démarré à côté du job : ici PostgreSQL 17,
    # la même version que celle de render.yaml.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tests
        ports:
          - 5432:5432
        # Le job attend que PostgreSQL soit prêt avant de commencer.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.13.0"
          enable-cache: true

      - name: Installer les dépendances
        run: uv sync --locked

      - name: Lancer les tests sur PostgreSQL
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/tests
        run: uv run pytest -v

  # --- Job 3 : l'image Docker --------------------------------------------------
  docker:
    name: Image Docker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Construire l'image
        run: docker build -t webapp:ci .

      # Démarre un conteneur avec une clé secrète jetable, juste pour le test.
      - name: Démarrer le conteneur
        run: |
          docker run -d --name webapp -p 5000:5000 \
            -e SECRET_KEY=cle-jetable-pour-la-ci \
            webapp:ci

      # Test de fumée : on attend que le site réponde (30 secondes maximum),
      # puis on vérifie quelques pages.
      - name: Vérifier que le site répond
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5000/ > /dev/null; then
              echo "Le site répond après ${i} seconde(s)."
              break
            fi
            sleep 1
          done
          curl -sf http://localhost:5000/ | grep -q "Bienvenue"
          curl -sf http://localhost:5000/bonjour | grep -q "Noms enregistrés"
          curl -sf http://localhost:5000/connexion | grep -q "Connexion"
          echo "Toutes les pages répondent."

      # En cas d'échec, affiche les messages du conteneur pour comprendre.
      - name: Afficher les logs du conteneur
        if: failure()
        run: docker logs webapp
