services:
  webapp:
    build: .
    ports:
      # Le site est accessible sur http://localhost:5000 depuis Windows.
      - "127.0.0.1:5000:5000"
    volumes:
      # La base de données est rangée dans un "volume" Docker : elle est
      # conservée même si le conteneur est supprimé ou reconstruit.
      - donnees:/app/data
    environment:
      # Fuseau horaire utilisé pour les dates enregistrées.
      TZ: Europe/Paris
      # Clé secrète lue dans le fichier .env du projet. Si elle manque,
      # Docker refuse de démarrer et affiche ce message.
      SECRET_KEY: ${SECRET_KEY:?Ajoutez SECRET_KEY dans le fichier .env (voir .env.example)}
    # Redémarre automatiquement avec Docker Desktop, sauf si vous l'arrêtez.
    restart: unless-stopped

volumes:
  donnees:
